<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Airfield Command</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=Special+Elite&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="title">Airfield Command</div>
      <div class="station" id="station"></div>
    </div>
    <div class="clock">
      <div id="date"></div>
      <div id="time"></div>
    </div>
    <div class="resources">
      <div class="res" title="Station funds"><span class="k">Funds</span><span id="r-funds"></span></div>
      <div class="res" title="Aviation fuel (gallons) / storage capacity"><span class="k">Fuel</span><span id="r-fuel"></span></div>
      <div class="res" title="Spare parts for repairs"><span class="k">Parts</span><span id="r-parts"></span></div>
      <div class="res" title="Station morale affects mission success"><span class="k">Morale</span><span id="r-morale"></span></div>
      <div class="res" title="Reputation with Group HQ unlocks missions and aircraft"><span class="k">Reputation</span><span id="r-rep"></span></div>
    </div>
    <div class="controls">
      <div class="speed" id="speed" title="Space to pause, 1–3 to set speed">
        <button data-speed="0" aria-label="Pause">❚❚</button>
        <button data-speed="1" aria-label="Normal speed">▶</button>
        <button data-speed="2" aria-label="Fast">▶▶</button>
        <button data-speed="3" aria-label="Fastest">▶▶▶</button>
      </div>
      <button id="btn-save">Save</button>
      <button id="btn-new" class="ghost-dark">New game</button>
    </div>
  </header>

  <main>
    <div class="left">
      <section class="field">
        <canvas id="field"></canvas>
        <div id="tooltip" class="tooltip" hidden></div>
        <div id="raid-banner" class="raid-banner" hidden></div>
        <div id="infobox" class="infobox" hidden></div>
        <div id="orders" class="orders-chip" hidden></div>
        <div id="radio" class="radio-card" hidden></div>
        <div class="view-help">Drag to rotate · Right-drag or WASD to pan · Scroll to zoom · Double-click to focus · H to reset</div>
      </section>
      <section class="log-box">
        <div class="log-head">Station Log</div>
        <div id="log"></div>
      </section>
    </div>
    <aside class="panel">
      <nav class="tabs">
        <button data-tab="station">Station</button>
        <button data-tab="aircraft">Aircraft</button>
        <button data-tab="personnel">Personnel</button>
        <button data-tab="missions">Missions</button>
        <button data-tab="supply">Supply</button>
      </nav>
      <div class="panel-body" id="panel-body"></div>
    </aside>
  </main>

  <div id="toast" class="toast" hidden></div>
  <div id="modal" class="modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-text">
      <p id="modal-text"></p>
      <div class="modal-actions">
        <button id="modal-cancel" class="ghost">Cancel</button>
        <button id="modal-ok" class="primary">OK</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/state.js"></script>
  <script src="js/sim.js"></script>
  <script src="js/render.js"></script>
  <script src="js/three/textures.js"></script>
  <script src="js/three/models.js"></script>
  <script src="js/three/aircraft.js"></script>
  <script src="js/three/world.js"></script>
  <script src="js/three/render3d.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
